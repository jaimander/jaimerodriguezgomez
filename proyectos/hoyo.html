<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Hoyo — Jaime Rodríguez Gómez</title>

    <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body data-project-id="hoyo">
    <nav aria-label="Navegación principal">
      <input type="checkbox" id="check" />

      <label for="check" class="checkbtn" aria-label="Abrir menú">
        <i class="fas fa-bars"></i>
      </label>

      <div id="name">
        <p>
          <a href="../index.html">Jaime Rodríguez Gómez</a>
        </p>
      </div>

      <ul>
        <li class="nav-link">
          <a href="../index.html" data-i18n="nav.projects">Proyectos</a>
        </li>
        <li class="nav-link">
          <a href="../about.html" data-i18n="nav.about">Acerca de</a>
        </li>
        <li class="nav-link">
          <a href="../cv.html" data-i18n="nav.cv">CV</a>
        </li>
        <li class="nav-link language-switch">
          <button type="button" data-lang="es" aria-pressed="true">
            ES
          </button>
          <span>/</span>
          <button type="button" data-lang="en" aria-pressed="false">
            EN
          </button>
        </li>
      </ul>
    </nav>

    <main>
      <section class="section--descripcion">
        <h1 class="titulo" data-project-field="title">Hoyo</h1>

        <h4 class="año" data-project-field="year">2015</h4>

        <br />

        <div class="descripcion--text">
          <p
            data-project-field="description"
            style="white-space: pre-line"
          ></p>
        </div>

        <div class="video-container">
          <iframe
            width="100%"
            height="300"
            src="https://www.youtube.com/embed/Nij_3JaHOR4"
            title="Hoyo — gameplay video"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>

        <br />

        <div data-project-images></div>

        <div class="border"></div>
      </section>
    </main>

    <section class="section--menu-mobile"></section>

    <script src="../js/project-page.js" defer></script>
  </body>
</html>
